name: Deploy docs site

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "packages/**"
      - "templates/**"
      - "scripts/supply-chain-status.ts"
      - "scripts/cloudflare-pages-auth.mjs"
      - "scripts/deploy-pages.ts"
      - "scripts/pages-publication.ts"
      - "deployment/production/contact.jsonc"
      - "cbom.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      rollback_deployment:
        description: "Audited production Pages deployment UUID to restore (blank for deploy)"
        required: false
        type: string
      sync_current:
        description: "Reconcile contact policy after an external rollback or interrupted release"
        required: false
        default: false
        type: boolean

concurrency:
  group: sorane-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "23"

      - name: Verify Cloudflare Pages authentication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/cloudflare-pages-auth.mjs

      - name: Install dependencies
        run: npm ci

      - name: Update supply chain status
        if: inputs.rollback_deployment == '' && inputs.sync_current != true
        run: npm run supply-chain:status

      - name: Build search index
        if: inputs.rollback_deployment == '' && inputs.sync_current != true
        run: node packages/cli/src/main.ts index --cwd website --force

      - name: Build docs site
        if: inputs.rollback_deployment == '' && inputs.sync_current != true
        run: node packages/cli/src/main.ts build --cwd website --clean

      - name: Verify publication coordinator
        run: node --test tests/pages-publication.test.ts

      - name: Publish Pages and contact policy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ROLLBACK_DEPLOYMENT: ${{ inputs.rollback_deployment }}
          SYNC_CURRENT: ${{ inputs.sync_current }}
        run: |
          args=()
          if [ -n "$ROLLBACK_DEPLOYMENT" ]; then args+=(--rollback "$ROLLBACK_DEPLOYMENT"); fi
          if [ "$SYNC_CURRENT" = "true" ]; then args+=(--sync-current); fi
          node scripts/deploy-pages.ts "${args[@]}"
