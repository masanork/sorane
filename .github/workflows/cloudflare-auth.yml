name: Cloudflare Pages auth diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sorane-cloudflare-auth
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "23"

      - name: Verify diagnostic redaction and account checks
        run: node --test tests/cloudflare-pages-auth.test.mjs

      - name: Check the actual CI token and Pages account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/cloudflare-pages-auth.mjs
