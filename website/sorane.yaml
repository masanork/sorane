preset: okf-site

site:
  title: 空音
  description: OKF-native static site generator
  base_url: https://sorane.dev
  lang: ja
  license: MIT
  license_page: license.html
  copyright_since: 2023
  copyright_holder: Masanori Kusunoki
  contact:
    page: contact.html
    form:
      enabled: true
      privacy_notice: 入力内容は問い合わせへの対応に使用し、受付から30日後に削除します。
  hosting:
    provider: cloudflare
    cloudflare:
      pages_project: sorane
      zone_name: sorane.dev
      web_analytics: true

build:
  content_dir: content
  out_dir: dist
  permalink: "{{slug}}.html"
  static_dir: static
  diagrams:
    enabled: true
  blog:
    archives: true
    tags: false
    featured_mode: off
    index_archive_limit: 3

docs:
  index_layout: landing
  nav:
    - section: はじめに
    - getting-started.html
    - features.html
    - ai-onboarding.html
    - section: リファレンス
    - cli.html
    - configuration.html
    - diagrams.html
    - section: OKF・オープンデータ
    - okf-profile.html
    - open-data-harvesting.html
    - ai-disclosure.html
    - section: 運用
    - contact.html
    - deployment.html
    - releases.html
    - supply-chain.html
    - license.html

search:
  index: .sorane/index.db
  webmcp:
    read_page: true
    datasets: true
    knowledge_packs: true
    contact: true

fonts:
  enabled: false
